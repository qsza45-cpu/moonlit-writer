<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src blob:; connect-src 'none'"><title>Moonlit Writer</title><link rel="stylesheet" href="style.css"></head><body>
<header><span>MOONLIT WRITER</span><span>당신의 이야기가 빛나는 시간</span></header>
<main class="scene"><div class="left"><section class="card"><p class="eyebrow">FOCUS</p><button id="start" class="jewel" aria-label="집중 시작">▶</button><p id="status">한 문장부터 시작해요</p></section><section class="card small"><button id="reset">↻ <span>다시 시작</span></button></section><section class="card stats"><p>오늘의 집필</p><strong id="today">0분</strong><p id="streak">새로운 첫 페이지</p><div class="dots" id="days"></div><span id="sessions">완료한 집중 0회</span></section></div>
<div class="dial"><svg viewBox="0 0 200 200" aria-hidden="true"><circle class="track" cx="100" cy="100" r="94"/><circle id="progress" cx="100" cy="100" r="94"/></svg><span class="star">✧</span><p id="modeLabel">집중하는 시간</p><h1 id="time">25:00</h1><span class="star">✧</span></div>
<div class="right"><section class="card"><p class="eyebrow" id="presetLabel">25 / 5</p><div class="segmented"><button id="focus" class="selected">♧ 집필</button><button id="break">☕ 휴식</button></div><button class="textbutton" id="settings">시간 설정</button></section><section class="card"><p class="eyebrow">SOUNDSCAPES</p><div class="sounds"><button data-sound="off" class="selected" aria-label="소리 끄기">☾</button><button data-sound="rain" aria-label="빗소리">☂</button><button data-sound="waves" aria-label="파도 소리">≈</button></div><label class="volume">음량 <input id="volume" type="range" min="0" max="100" value="35"></label></section><section class="card goal"><p>오늘의 글자 목표</p><label><input id="chars" type="number" min="0" max="10000000" value="0" aria-label="오늘 작성한 글자수"> / <span id="goalLabel">2,000</span>자</label><progress id="goalProgress" max="2000" value="0"></progress><small>작성한 글자수를 직접 기록해요</small></section><div class="utility"><button id="compact">⛶ 미니 모드</button><button id="pin" aria-pressed="false">♧ 항상 위</button></div></div>
</main><footer><span>✦ 작은 집중이, 하나의 이야기가 됩니다.</span><button id="export">기록 내보내기</button><span id="notice" role="status"></span></footer>
<dialog id="config"><form id="configForm"><p class="eyebrow">나의 집필 리듬</p><label>집중 시간 (분)<input id="focusMinutes" type="number" min="1" max="180" required></label><label>휴식 시간 (분)<input id="breakMinutes" type="number" min="1" max="60" required></label><label>하루 글자 목표<input id="dailyGoal" type="number" min="1" max="10000000" required></label><p>시간을 바꾸면 진행 중인 타이머가 초기화돼요.</p><div><button type="button" id="cancel">취소</button><button type="submit">저장</button></div></form></dialog>
<script src="timer.cjs"></script><script src="app.js"></script></body></html>
