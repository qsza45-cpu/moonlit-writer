<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src blob:; connect-src 'none'"><title>Moonlit Writer</title><link rel="stylesheet" href="style.css"></head><body><main id="widget">
<img class="compact-art" src="assets/compact.png" draggable="false" alt="금색 초승달과 분홍 보석이 장식된 열린 컴팩트"><div class="drag" title="클릭: 뚜껑 열기·닫기 / 드래그: 위치 이동"></div><button id="fold" class="fold-button" aria-label="뚜껑 닫기" title="뚜껑 닫기">⌄</button><div class="window-controls"><button id="minimize" aria-label="최소화">−</button><button id="close" aria-label="종료">×</button></div>
<div class="ring"><svg viewBox="0 0 200 200" aria-hidden="true"><circle class="track" cx="100" cy="100" r="96"/><circle id="progress" cx="100" cy="100" r="96"/></svg></div>
<div class="content"><section class="page current" data-page="0" aria-label="자동 집필 시간"><p>오늘의 집필 시간</p><h2 id="typingTime" class="auto-time">00:00:00</h2><span id="typingStatus" class="auto-status">집필 앱의 타이핑을 기다려요</span><div class="auto-tools"><button id="typingToggle" aria-pressed="true">자동 측정 켜짐</button><button id="typingRetry">감지 확인</button></div><small>입력이 멈추면 자동으로 대기해요</small></section><section class="page" data-page="1" aria-label="타이머" hidden><p id="modeLabel">집중하는 시간</p><h1 id="time">25:00</h1><div class="mode"><button id="focus" class="selected">집필</button><button id="break">휴식</button></div><div class="actions"><button id="reset" aria-label="타이머 초기화">↻</button><button id="start" aria-label="집중 시작">▶</button><button id="pin" aria-label="항상 위" aria-pressed="true">♧</button></div></section>
<section class="page" data-page="2" aria-label="오늘 기록" hidden><p>오늘의 집필</p><h2 id="today">0분</h2><span id="sessions">완료한 집중 0회</span><span id="streak">첫 페이지</span><label class="chars">오늘 쓴 글자 <input id="chars" type="number" min="0" max="10000000" value="0" aria-label="오늘 작성한 글자수"></label><progress id="goalProgress" max="2000" value="0"></progress><small id="goalLabel">목표 2,000자 · 직접 기록</small><button id="export" class="text-button">기록 내보내기</button></section>
<section class="page" data-page="3" aria-label="소리" hidden><p>나만의 고요</p><div class="sounds"><button data-sound="off" class="selected" aria-label="소리 끄기">☾</button><button data-sound="rain" aria-label="빗소리">☂</button><button data-sound="waves" aria-label="파도 소리">≈</button></div><label class="volume">음량<input id="volume" type="range" min="0" max="100" value="35"></label><small>달 · 빗소리 · 파도</small></section>
<section class="page" data-page="4" aria-label="설정" hidden><p>나의 집필 리듬</p><form id="configForm"><label>집중 (분)<input id="focusMinutes" type="number" min="1" max="180" required value="25"></label><label>휴식 (분)<input id="breakMinutes" type="number" min="1" max="60" required value="5"></label><label>글자 목표<input id="dailyGoal" type="number" min="1" max="10000000" required value="2000"></label><label>위젯 크기<input id="widgetSize" type="range" min="60" max="160" step="5" value="100" aria-label="위젯 크기"><span id="sizeValue">100%</span></label><label class="startup-label"><span>로그인 시 자동 실행</span><input id="startup" type="checkbox" aria-label="로그인 시 자동 실행"></label><button type="submit">설정 저장</button></form><small>저장하면 타이머가 초기화돼요</small></section><section class="page" data-page="5" aria-label="자동 측정 설정" hidden><p>시간을 잴 집필 앱</p><form id="targetsForm"><textarea id="targetsInput" aria-label="집필 앱 이름" placeholder="앱 이름을 쉼표로 구분" required></textarea><button type="submit">측정 앱 저장</button></form><small>앱 이름을 쉼표로 구분해요</small><button id="toTyping" class="text-button">자동 집필 화면으로</button></section></div>
<button id="prev" class="arrow" aria-label="이전 화면">‹</button><button id="next" class="arrow" aria-label="다음 화면">›</button><nav aria-label="가운데 화면 선택"><button data-go="0" class="active" aria-label="자동 집필 화면"></button><button data-go="1" aria-label="타이머 화면"></button><button data-go="2" aria-label="오늘 기록 화면"></button><button data-go="3" aria-label="소리 화면"></button><button data-go="4" aria-label="설정 화면"></button><button data-go="5" aria-label="측정 앱 화면"></button></nav><span id="notice" role="status"></span></main><script src="timer.cjs"></script><script src="app.js"></script></body></html>
